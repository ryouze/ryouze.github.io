name: "CD: Deploy website to GitHub Pages"

on:
  # Run on pushes to `main` (avoid duplicate runs on feature branches) and on pull requests
  # Also allow manual runs from the `Actions` tab
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  TZ: Europe/Warsaw
  HUGO_VERSION: 0.167.0

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      pages: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # This downloads the entire Git history
          # With `enableGitInfo = true` in `hugo.toml`, we can use Git to tell when files were last modified
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Configure GitHub Pages
        id: configure_pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        run: |
          echo "Installing Hugo ${HUGO_VERSION}..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Build website
        run: |
          hugo build \
            --minify \
            --baseURL "${{ steps.configure_pages.outputs.base_url }}/"

      - name: Upload GitHub Pages artifact
        # Only upload deployment artifacts for `main`, not pull requests
        # TODO(ryouze): Consider moving the build job to a separate file so we won't need these `if` checks
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    # Deploy only from `main` after a successful build, never from pull requests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy_pages
        uses: actions/deploy-pages@v5
